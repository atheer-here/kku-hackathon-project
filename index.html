<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-view="intro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساري | Massari</title>
<meta name="description" content="Massari: which Vision 2030 sector works like you? A two-minute bilingual read. Independent and illustrative.">
<script>
  // Pre-paint: theme and language from saved choice, else system / browser language.
  (function () {
    var h = document.documentElement, lang, theme;
    try { lang = localStorage.getItem("massari-lang"); theme = localStorage.getItem("massari-theme"); } catch (e) {}
    if (lang !== "ar" && lang !== "en") lang = /^ar\b/i.test(navigator.language || "") ? "ar" : (navigator.language ? "en" : "ar");
    if (theme !== "light" && theme !== "dark") theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    h.lang = lang; h.dir = lang === "ar" ? "rtl" : "ltr"; h.setAttribute("data-theme", theme);
  })();
</script>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
