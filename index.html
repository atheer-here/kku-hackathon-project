<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="An illustrative self-reflection quiz for exploring sector interests.">
  <title>Which sector suits you? | Vision 2030 Quiz</title>
  <script>
    (function () {
      var theme = "light";
      try {
        var saved = localStorage.getItem("vision-sector-theme");
        if (saved === "light" || saved === "dark") theme = saved;
        else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
      } catch (error) {
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
      }
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="data/sectors.js" defer></script>
  <script src="data/questions.js" defer></script>
  <script src="js/quiz-engine.js" defer></script>
  <script src="js/download-card.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to quiz</a>
  <main id="app" class="page-shell" tabindex="-1"></main>
  <div id="live-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
